<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - SecureScan</title>
<link rel="stylesheet" href="assets/css/main.css?v=ops1">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card tilt-3d">
    <div class="logo-row"><img class="logo-3d" src="assets/img/securescan-shield-3d.png" alt="" width="28" height="28"> SecureScan</div>
    <h2>Reset your password</h2>
    <p class="text-dim mb-16">Enter your account email and we'll send you a reset link.</p>
    <form id="forgot-form">
      <div class="form-group"><label for="email">Email</label><input id="email" type="email" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Send Reset Link</button>
    </form>
    <div class="mt-16" style="font-size:13.5px;"><a href="login.html">Back to log in</a></div>
    <div id="dev-link-box" class="dev-link-box">
      <p class="text-dim" style="margin-bottom:8px;">SMTP is not sending yet. Open this debug link, then set EMAIL_HOST_USER and EMAIL_HOST_PASSWORD in backend/.env:</p>
      <a id="dev-reset-link" href="#">Reset your password</a>
    </div>
  </div>
</div>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api-config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/notifications.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const box = document.getElementById('dev-link-box');
  box.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const data = await Api.post('/api/auth/password-reset/', { email: document.getElementById('email').value.trim() });
    if (data.email_sent) {
      Toast.success('If that account exists, a reset email is on its way. Check your inbox.');
    } else {
      Toast.success(data.message);
    }
    if (data.dev_reset_link) {
      const a = document.getElementById('dev-reset-link');
      a.href = data.dev_reset_link;
      box.classList.add('show');
    }
  } catch (err) {
    Toast.error(err.message || 'Something went wrong.');
  } finally {
    btn.disabled = false; btn.textContent = 'Send Reset Link';
  }
});
</script>
</body>
</html>
