<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - SecureScan</title>
<link rel="stylesheet" href="assets/css/main.css?v=ops1">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Set a new password</h2>
    <form id="reset-form">
      <div class="form-group"><label for="new_password">New password</label><input id="new_password" type="password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Reset Password</button>
    </form>
    <div class="mt-16" style="font-size:13.5px;"><a href="login.html">Back to log in</a></div>
  </div>
</div>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api-config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/notifications.js"></script>
<script>
const token = Utils.getQueryParam('token');
document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!token) { Toast.error('Missing reset token.'); return; }
  try {
    await Api.post('/api/auth/password-reset/confirm/', { token, new_password: document.getElementById('new_password').value });
    Toast.success('Password reset. You can now log in.');
    setTimeout(() => location.href = 'login.html', 1200);
  } catch (err) {
    Toast.error(err.message || 'Reset failed.');
  }
});
</script>
</body>
</html>
